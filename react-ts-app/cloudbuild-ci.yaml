# CI on Cloud Build (GitHub Actions is billing-blocked): every pull request to
# main runs what .github/workflows/ci.yml runs — npm ci, lint, the tests and
# the build — and the Cloud Build GitHub app reports the result on the PR.
# Started by the `frontend-pr` trigger in revenact-deploy/terraform/cloudbuild.tf;
# no secrets, nothing pushed.
steps:
  - id: ci
    name: node:22  # same major as the Dockerfile (node:22-alpine)
    entrypoint: bash
    env:
      - CI=true
    args:
      - -c
      - |
        set -euo pipefail
        npm ci --no-audit --no-fund
        npm run lint
        npm test
        npm run build

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
