# Ingress for the Cloud Run `web` service. Cloud Run's front end terminates
# TLS and forwards plain HTTP here on :8080; Django runs beside this container
# on 127.0.0.1:8000. Included inside nginx's http {} block.
#
# A template: the image's entrypoint substitutes ${PUBLIC_HOST} (the service's
# one public hostname, set in revenact-deploy/services/web.yaml) at start-up.
# Django and the CSP get that configured host, never the client's Host header.
# Unset, nginx refuses to start (an unknown variable) rather than run open.

# Access log without query strings: the WebSocket JWT travels in the query
# (SOC2:LOG-03). $uri is the path only. Public survey links carry their token
# in the path itself, so those requests are not logged at all (below), and the
# error log, which always prints the full request line, is held to `crit`
# server-wide (see the server block).
log_format noquery '$remote_addr "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time';

# Only a WebSocket upgrade is forwarded: Django always sees `Upgrade: websocket`
# (never the client's value), and `Connection: upgrade` only when the client
# asked for a WebSocket. Any other Upgrade (h2c in particular, which would
# tunnel past this proxy) therefore stays a plain HTTP/1.1 request.
map $http_upgrade $connection_upgrade {
    default         "";
    "~*^websocket$" upgrade;
}

# Cloud Run always reaches us over HTTPS; keep the scheme the Google front end
# reports, default https.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      https;
}

upstream django {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout noquery;
    # nginx's error lines always print the full request line, query included,
    # so only critical ones: a failed proxy still shows as a 502 in Cloud
    # Run's own request log, and Django logs its errors (redacted) itself.
    error_log /dev/stderr crit;

    root /usr/share/nginx/html;
    client_max_body_size 32m;  # Cloud Run's own request cap

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SOC2:API-06 / DATA-03 transport and browser hardening on every response
    # (Django sets the same on /api and /admin; this covers the SPA too).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Django: the API (incl. API docs), the admin, the collected static files.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host ${PUBLIC_HOST};
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Let streamed responses (Copilot) reach the browser as they are written.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Public survey links: the token is the path. Same proxying, no logging.
    location ^~ /api/v1/public/ {
        access_log off;
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host ${PUBLIC_HOST};
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSockets (Copilot sessions, notifications), mounted on the ASGI app.
    location /ws/ {
        proxy_pass http://django;
        # The rule matches any WebSocket proxy; its mitigation is applied here
        # (Upgrade is always the literal `websocket`, Connection only for a
        # real WebSocket request), and an h2c upgrade is verified to stay HTTP.
        proxy_http_version 1.1;  # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Upgrade websocket;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host ${PUBLIC_HOST};
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;  # Cloud Run's request ceiling; the client reconnects
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The SPA: real files first, everything else is a client-side route.
    location / {
        # add_header in a location replaces the server-level ones, so repeat them.
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # SOC2:API-06 content security policy for the SPA: scripts only from
        # this origin (the Vite build has no inline scripts); styles inline
        # (Recharts) plus Google Fonts, which index.html links; customer logos
        # from Clearbit (mapToAccountRow.ts); API and WebSocket calls to this
        # origin only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://logo.clearbit.com; connect-src 'self' wss://${PUBLIC_HOST}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri /index.html;
    }
}
